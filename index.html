/* new task form */
.nfh h2{display:flex;align-items:center;gap:10px;font-size:20px}
.nfi{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);font-size:18px}
.grad{background:linear-gradient(90deg,#7C3AED,#EC4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.nform{display:flex;flex-direction:column;gap:12px}
.nbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow)}
.nl{font-size:12px;font-weight:700;color:var(--muted)}
.ntitle input{border:0;background:transparent;font-size:20px;font-weight:700;padding:2px 0;outline:none;width:100%;color:var(--fg)}
.ntitle:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.nsec{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.03em;margin-top:2px}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ngrid{grid-template-columns:minmax(0,1fr)}}
.nacc{border-left:4px solid #F59E0B}
.ndates{gap:8px}
.ndates label{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}
.nst{background:color-mix(in srgb,var(--doing-soft) 55%,var(--surface))}
.npri{background:color-mix(in srgb,var(--review-soft) 55%,var(--surface))}
.nbox .in{background:var(--surface);height:38px;padding:6px 10px}
.nnotes{min-height:90px}
.nsubmit{border:0;border-radius:14px;padding:13px;font-weight:700;font-size:15px;color:#fff;background:linear-gradient(90deg,#4F46E5,#7C3AED 55%,#A855F7);box-shadow:0 6px 18px rgba(124,58,237,.3);cursor:pointer}
.nsubmit:hover{filter:brightness(1.06)}
/* calendar spans */
.cc.cb-routine,.cc.cb-company,.cc.cb-project,.cc.cb-general{background:var(--ccs);color:var(--cc);border-left-color:var(--cc)}
.cc.cb-routine,.cc.cb-company,.cc.cb-project,.cc.cb-general{border-left:0;border-radius:7px;padding:2px 7px;font-weight:600;font-size:11.5px}
.cc.k-start{background:transparent;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--cc) 45%,transparent)}
.cc.k-due{background:var(--ccs)}
.cc .ico{opacity:.9}
@media (max-width:700px){.cc.cb-routine,.cc.cb-company,.cc.cb-project,.cc.cb-general{padding:0;width:8px;height:8px;border-radius:99px;background:var(--cc);box-shadow:none}}

/* list rows (search, day) */
.dayrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}
.dayrow:first-of-type{border-top:0}
.dayrow:hover .nm{text-decoration:underline}
.dayrow .nm{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-weight:500}

/* modal */
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,25,45,.32);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:flex-end;padding:12px max(12px,env(safe-area-inset-right,0px)) 12px 12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--panel);width:min(700px,100%);height:100%;overflow:auto;padding:20px 22px 40px;display:flex;flex-direction:column;gap:16px;border-radius:24px;box-shadow:var(--shadow-lg);border:1px solid var(--line);animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:700px){
  .overlay{padding:0;padding-top:env(safe-area-inset-top,0px)}
  .sheet{border-radius:22px 22px 0 0;margin-top:24px;height:calc(100% - 24px);padding:18px max(16px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:slideup .25s ease-out}
  @keyframes slideup{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
}
.sh{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:-20px;z-index:2;background:var(--panel);margin:-20px -22px 0;padding:18px 22px 10px}
@media (max-width:700px){.sh{margin:-18px max(-16px,calc(env(safe-area-inset-right,0px)*-1)) 0;padding:14px 16px 10px;top:-18px}}
.sh h2{font-size:20px}
.x{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.x:hover{background:var(--surface-2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>.in{max-width:100%}
input.in[type=date],input.in[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;width:100%;height:46px;line-height:1.45;text-align:left;background-color:var(--surface)}
input.in[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
input.in[type=date]::-webkit-calendar-picker-indicator{opacity:.6}
.fields>.field input.in,.fields>.field select.in{height:46px}
.sh>div{min-width:0}
.sh .hint{margin-top:2px}
.field.wide{grid-column:1/-1}
.field>label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.sec h3{display:flex;align-items:center;gap:8px}
.npv span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.npv{display:block;white-space:pre-wrap;overflow-wrap:anywhere;text-align:left;width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--fg-2);font-size:14px;line-height:1.65}
.npv:hover{background:var(--surface-3)}
.npop{position:fixed;inset:0;z-index:95;background:rgba(15,25,45,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.npbox{width:min(760px,100%);height:min(720px,100%);background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:18px 20px;display:flex;flex-direction:column;gap:12px;animation:popin .18s ease-out}
.npbox textarea.in{flex:1;min-height:0;resize:none;font-size:15.5px;line-height:1.75;padding:14px 16px;background:var(--surface-2);border-color:var(--line)}
.npbox textarea.in:focus{background:var(--surface)}
@keyframes popin{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.sec h3 svg{color:var(--muted)}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;min-width:0;accent-color:var(--brand)}
.range output{min-width:3.2em;text-align:right;font-weight:600}
.task{display:flex;align-items:center;gap:8px;padding:2px 0}
.task input[type=checkbox]{width:18px;height:18px;accent-color:var(--done);flex:none}
.task .t{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;resize:none;overflow:hidden;line-height:1.55;font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}
.task{align-items:flex-start}.task input[type=checkbox]{margin-top:7px}.task .ib{margin-top:2px}
.task .t:hover{border-color:var(--line)}
.task .t:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.ib{border:0;background:none;color:var(--muted);padding:6px;border-radius:8px;display:inline-flex;flex:none}
.ib:hover{background:var(--surface-2);color:var(--danger)}
.addrow{display:flex;gap:8px}
.atts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.att{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.att img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:var(--surface-2)}
.att .fi{aspect-ratio:4/3;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em}
.att a{font-size:12.5px;overflow-wrap:anywhere;color:var(--fg-2);font-weight:500}
.att .ad{align-self:flex-end}
.hist{font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.hist div{display:flex;flex-wrap:wrap;gap:2px 14px}
.foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--surface);padding:10px 18px;border-radius:14px;font-size:14px;max-width:90vw;box-shadow:var(--shadow-lg);font-weight:500}
@media (pointer:coarse){
  .btn,.navb{min-height:44px}
  .btn.small{min-height:40px}
  .in{min-height:44px;font-size:16px}
  .chk{width:30px;height:30px}
  .seg button{min-height:38px;padding-left:16px;padding-right:16px}
  .ib{padding:11px}
  .task input[type=checkbox]{width:24px;height:24px}
  .steps button{min-height:42px}
  .x{width:44px;height:44px}
  .dayrow,.alert{padding-top:13px;padding-bottom:13px}
  .kh .kplus{width:40px;height:40px}
}

/* compact mode: every page except the overview */
.cpt #view{gap:14px}
.cpt .inner{gap:14px}
.cpt h1{font-size:22px}
.cpt .page-head h2{font-size:18px!important}
.cpt .sub{font-size:13px}
.cpt .btn{padding:6px 12px;font-size:13.5px;border-radius:10px;gap:5px}
.cpt .btn svg{width:14px;height:14px}
.cpt .btn.small{padding:4px 10px;font-size:12.5px}
.cpt .in{padding:7px 10px;font-size:14px;border-radius:10px}
.cpt .search .in{padding-left:40px}
.cpt .filters select{padding-top:4px;padding-bottom:4px;font-size:13px}
.cpt .card{padding:14px 16px;border-radius:16px;gap:10px}
.cpt .card h2{font-size:15.5px}
.cpt .tiles{gap:10px}
.cpt .tile{padding:10px 14px;gap:4px;border-radius:14px}
.cpt .tile .tv{font-size:26px}
.cpt .tl{font-size:13px}
.cpt .pill,.cpt .pri,.cpt .tag{font-size:11.5px}
.cpt .pill{padding:1px 8px}
.cpt .pct{font-size:12.5px}
.cpt .bar{height:5px}
.cpt .rlist{border-radius:16px}
.cpt .rrow{padding:9px 14px;gap:3px 12px;grid-template-columns:auto minmax(0,1fr) 140px auto}
.cpt .rrow>.rres{min-width:112px}
.cpt .rn{font-size:14px}
.cpt .rm{font-size:12px;gap:3px 10px}
.cpt .chk{width:20px;height:20px;border-radius:6px}
.cpt .chk svg{width:12px;height:12px}
.cpt .pgrid{gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.cpt .pcard{padding:12px 14px;gap:8px;border-radius:14px}
.cpt .pcard .ttl{font-size:14.5px}
.cpt .kv{font-size:12.5px}
.cpt .steps button{font-size:11.5px;padding:4px 2px}
.cpt .board{gap:12px}
.cpt .kcol{padding:9px;gap:8px;border-radius:16px}
.cpt .kh .pill{font-size:12.5px}
.cpt .kcard{padding:10px 12px;gap:7px;border-radius:12px}
.cpt .kcard .kt{font-size:14px}
.cpt .kcard .meta{font-size:12.5px;gap:4px}
.cpt .kcard select{font-size:12px;padding:3px 26px 3px 8px;height:32px;min-height:32px!important}
.cpt .kcard .hr{display:none}
.cpt .kcard .meta{flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px 10px}
.cpt .kcard .who span{max-width:9em}
.cpt .segtab button{font-size:13px;padding:4px 12px}
.cpt .tbl{font-size:13px}
.cpt .tbl th{padding:8px 12px;font-size:12.5px}
.cpt .tbl td{padding:8px 12px}
.cpt .av{--s:22px}
.cpt .calcard{padding:14px 14px 12px}
.cpt .mnav button{width:32px;height:32px}
.cpt .mnav b{line-height:32px;font-size:14px;min-width:8.5em}
.cpt .cell{min-height:86px;padding:4px}
.cpt .cc{font-size:11px;padding:1px 5px}
.cpt .dn{font-size:12.5px;min-width:22px;height:22px;line-height:22px}
.cpt .calwrap{gap:14px;grid-template-columns:minmax(0,1fr) 300px}
@media (max-width:1180px){.cpt .calwrap{grid-template-columns:minmax(0,1fr)}}
.cpt .dcard{padding:9px 12px;border-radius:12px}
.cpt .dcard .dt{font-size:14px}
.cpt .entry{padding:10px 14px;gap:4px;border-radius:14px}
.cpt .entry b{font-size:14px}
.cpt .entry .ed{font-size:13.5px}
.cpt .empty{padding:26px 16px;border-radius:16px}
/* detail sheet: compact everywhere */
.sheet{gap:12px;padding:16px 18px 32px}
.sh h2{font-size:18px}
.sec{padding:12px 14px;gap:10px;border-radius:14px}
.sec h3{font-size:14px}
.fields{gap:10px 12px}
.field>label,.lbl{font-size:12.5px}
.sheet .in{padding:7px 10px;font-size:14px;border-radius:10px}
.sheet .fields>.field input.in,.sheet .fields>.field select.in,.sheet input.in[type=date]{height:40px}
.sheet .btn{padding:6px 12px;font-size:13.5px;border-radius:10px}
.sheet .btn.small{padding:4px 10px;font-size:12.5px}
.sheet .x{width:34px;height:34px;border-radius:10px}
.sheet .hint{font-size:12.5px}
.sheet .task .t{padding:3px 8px;font-size:14px}
.npv{font-size:13.5px;padding:8px 12px}
@media (pointer:coarse){
  .cpt .btn,.sheet .btn{min-height:38px}
  .cpt .btn.small,.sheet .btn.small{min-height:34px}
  .cpt .in,.sheet .in{min-height:40px;font-size:16px}
  .cpt .chk{width:26px;height:26px}
  .cpt .navb{min-height:44px}
  .sheet .x{width:40px;height:40px}
}

.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.thm{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px;transition:border-color .15s,box-shadow .15s}
.thm:hover{border-color:var(--line-strong)}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sw{display:flex;height:40px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.sw i{flex:1}
.thm .tn{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
.thm .tn svg{color:var(--accent)}
.thm .td{font-size:12.5px;color:var(--muted)}
.setrow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
/* touch & iPad (Safari/Chrome on iPadOS) hardening */
html{-webkit-tap-highlight-color:transparent}
button,select,a,label,.cell,.trow{touch-action:manipulation}
input,select,textarea{-webkit-appearance:none;appearance:none}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto}
input[type=range]{-webkit-appearance:auto;appearance:auto}
.side,.sheet,.bellp,.boardwrap,.tblwrap{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
@supports not (color:color-mix(in srgb,red 50%,blue)){
  :root[data-palette]{--panel:var(--wash-1);--surface:#fff;--surface-2:var(--wash-1);--surface-3:var(--wash-2);--line:var(--wash-3);--line-strong:var(--wash-3);--g-track:var(--wash-2)}
  .app{border-color:var(--line)}
}
/* PIN lock */
.lock{position:fixed;inset:0;z-index:300;background:var(--panel);display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.locked{overflow:hidden}
body.locked .frame{visibility:hidden}
.lkbox{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.lkbox.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lkic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--brand);margin-bottom:4px}
.lkbox h2{font-size:20px}
.lkdots{display:flex;gap:12px;min-height:16px;margin:8px 0 2px}
.lkdots i{width:14px;height:14px;border-radius:99px;border:2px solid var(--line-strong);transition:background .12s,border-color .12s}
.lkdots i.on{background:var(--fg);border-color:var(--fg)}
.lkerr{color:var(--danger);font-size:13.5px;min-height:20px;font-weight:600}
.lkpad{display:grid;grid-template-columns:repeat(3,72px);gap:12px;justify-content:center}
.lkpad button{width:72px;height:72px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:24px;font-weight:500;color:var(--fg);box-shadow:var(--shadow)}
.lkpad button:active{background:var(--surface-3)}
.lkfoot{display:flex;gap:10px;justify-content:center;margin-top:8px;min-height:40px}
.lklink{background:none;border:0;color:var(--muted);font-size:13.5px;text-decoration:underline}

/* formal look: monochrome icons, neutral chips */
.ico{color:inherit}
.dtiles .emo{color:var(--muted)}
.dtiles .tl{color:var(--fg-2);font-weight:500}
.dtiles .tl::after{content:"";width:7px;height:7px;border-radius:99px;background:var(--tc);margin-left:auto;flex:none;align-self:center}
.dtiles .ctile:hover{border-color:var(--line-strong);background:var(--surface)}
.cchip{color:var(--fg-2);background:var(--surface-2);border:1px solid var(--line);font-weight:500}
.cchip .ico{color:var(--cc)}
.tgh .ico{color:var(--muted)!important}
.tdue .ico,.tst .ico,.nl .ico,.kl .ico,.td2 .ico{color:var(--muted)}
.tdue.late .ico{color:var(--danger)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--c);flex:none}
.tpri2,.tpri{display:inline-flex;align-items:center;gap:5px;color:var(--fg-2);font-weight:500}
.nfi{color:var(--fg-2)}
.grad{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:inherit!important}
.nsubmit{background:var(--accent)!important;color:var(--accent-ink)!important;box-shadow:var(--shadow)!important;border-radius:12px}
.nsubmit .ico{color:currentColor}
.nacc{border-left:1px solid var(--line)!important}
.nst,.npri{background:var(--surface)!important}
.rsubh .ico{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.dtiles .emo{color:var(--tc)!important;display:inline-flex;flex:none}
.dtiles .tl .emo svg{color:var(--tc)!important}
.dtiles .tl{flex-wrap:nowrap!important;white-space:nowrap!important;min-width:0}
.dtiles .tlt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dtiles .tl::after{margin-left:auto;padding-left:0;flex:none}
.dtiles .tvrow{padding-right:0!important}
.dtiles .ctile:hover{border-color:var(--tc)!important}

/* ===== Formal layout (full-screen, enterprise) ===== */
html,body{background:var(--wash-1)!important}
body{font-size:14.5px;letter-spacing:0}
.frame{padding:0!important;min-height:100dvh}
.app{max-width:none!important;margin:0!important;border-radius:0!important;box-shadow:none!important;border:0!important;min-height:100dvh!important;--side-w:248px;background:linear-gradient(to right,var(--surface) calc(var(--side-w) - 1px),var(--line) calc(var(--side-w) - 1px),var(--line) var(--side-w),var(--panel) var(--side-w))!important}
.app.mini{--side-w:72px}
.side{max-height:100dvh!important;background:var(--surface)!important;padding:16px 12px!important}
.main{padding:24px 32px 56px!important}
.inner{max-width:none!important}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
h2{font-size:15.5px;font-weight:600;letter-spacing:0}
.page-head .sub,.sub{color:var(--muted)}
.navb{border-radius:6px!important;font-size:14px;padding:9px 12px;position:relative}
.navb:hover{background:var(--surface-3)!important}
.navb[aria-current="page"]{background:var(--nav-active)!important;border-color:transparent!important;box-shadow:none!important;color:var(--nav-active-ink)!important}
.navb[aria-current="page"] .ni{color:var(--nav-active-ink)!important}
.navb[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}

  function calMap(key){

      if(p.due){if(p.due.slice(0,7)===key)d=p.due;}
      else if(p.category==='routine'&&p.dueDay){var dm=addMonth(cycle,rOff(p));if(key>=dm||(p.history||[]).some(function(x){return x.cycle===addMonth(key,-rOff(p));})){d=dateIn(key,p.dueDay);rec=true;}}
      if(d)(map[d]=map[d]||[]).push({p:p,rec:rec});
    });
    return map;
  }
  function entryDone(e,key){return e.rec?recDone(e.p,key):e.p.status==='done';}
  function calMap2(key){
    var map={},a=key.split('-'),dim=new Date(+a[0],+a[1],0).getDate(),first=key+'-01',last=key+'-'+pad(dim);
    function push(d,e){(map[d]=map[d]||[]).push(e);}
    function span(p,st,due,rec){
      var s0=st<first?first:st,e0=due>last?last:due;
      if(s0>e0)return;var d=new Date(s0+'T00:00:00'),end=new Date(e0+'T00:00:00');
      while(d<=end){var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(ds===st||ds===due)push(ds,{p:p,rec:rec,k:ds===st?'start':'due'});d.setDate(d.getDate()+1);}
    }
    filtered().forEach(function(p){
      var due='',rec=false;
      if(!p.due&&p.category==='routine'&&p.dueDay&&p.startDay){
        [addMonth(key,-1),key,addMonth(key,1)].forEach(function(occ){
          var du=dateIn(occ,p.dueDay),stt=p.startDay<=p.dueDay?dateIn(occ,p.startDay):dateIn(addMonth(occ,-1),p.startDay);
          if(calMode==='all'){if(du>=first&&stt<=last)span(p,stt,du,true);}
          else if(calMode==='start'){if(stt.slice(0,7)===key)push(stt,{p:p,rec:true,k:'start'});}
          else if(du.slice(0,7)===key)push(du,{p:p,rec:true,k:'due'});
        });
        return;
      }
      if(p.due)due=p.due;else if(p.category==='routine'&&p.dueDay){due=dateIn(key,p.dueDay);rec=true;}
      var st=p.start||'';
      if(st&&due&&st<=due&&calMode==='all'){
        var s0=st<first?first:st,e0=due>last?last:due;
        if(s0<=e0){var d=new Date(s0+'T00:00:00'),end=new Date(e0+'T00:00:00');
          while(d<=end){var ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());if(ds===st||ds===due)push(ds,{p:p,rec:rec,k:ds===st?'start':'due'});d.setDate(d.getDate()+1);}}
        return;
      }
      if(st&&calMode!=='due'&&st.slice(0,7)===key)push(st,{p:p,rec:false,k:'start'});
      if(due&&calMode!=='start'&&due.slice(0,7)===key&&due!==st)push(due,{p:p,rec:rec,k:'due'});
      else if(due&&calMode!=='start'&&due===st&&due.slice(0,7)===key&&calMode==='due')push(due,{p:p,rec:rec,k:'due'});
    });
    Object.keys(map).forEach(function(k){map[k].sort(function(x,y){var o={start:0,mid:1,due:2};return o[x.k]-o[y.k];});});
    return map;
  }

  function calHtml(){
    var a=calKey.split('-'),y=+a[0],m=+a[1]-1;

  /* ---------- export ---------- */
  function csvCell(c){c=String(c==null?'':c);if(/^[=+\-@]/.test(c))c="'"+c;return /[",\n\r]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}
  function toCsv(rows){return '﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');}
  function doExport(kind){
    if(!downloads)return;
    var name,data,d=todayStr();
    if(kind==='items'){
      var rows=[['หมวดงาน','ชื่องาน','สถานะ','ความสำคัญ','ผู้รับผิดชอบ','กำหนดส่ง','ความคืบหน้า (%)','ผลประเมิน','งานย่อยเสร็จ','งานย่อยทั้งหมด','ขั้นตอนโครงการ','ลูกค้า','เลขที่สัญญา','มูลค่าสัญญา','หมายเหตุ']];
      items.forEach(function(p){rows.push([lab(CAT,p.category),p.name,lab(ST,p.status),lab(PRI,p.priority),p.owner,dueOf(p),prog(p),p.result==='pass'?'ผ่าน':p.result==='fail'?'ไม่ผ่าน':'',p.tasks.filter(function(t){return t.done;}).length,p.tasks.length,p.category==='project'?lab(STG,p.stage):'',p.client||'',p.contractNo||'',p.contractValue||'',p.notes]);});
      name='tasks-'+d+'.csv';data=toCsv(rows);
    }else if(kind==='logs'){
      var r2=[['วันที่มีผล','ประเภท','หัวข้อ','รายละเอียด','ผู้บันทึก','บันทึกเมื่อ']];
      logs.slice().sort(logSort).forEach(function(l){r2.push([l.date,lab(LT,l.type),l.title,l.detail,l.source==='notion'?'นำเข้าจาก Notion':(nameCache[l.byId]||''),l.createdAt?new Date(l.createdAt).toISOString():'']);});
      name='change-log-'+d+'.csv';data=toCsv(r2);
    }else{
      var n=items.length,cnt={todo:0,doing:0,review:0,done:0},sum=0;
      items.forEach(function(p){cnt[p.status]++;sum+=prog(p);});
      var L=['# สรุปรายงานภาพรวม','','วันที่ '+fmtDate(d)+' · รอบงานรูทีน '+monthLabel(cycle),'','## ภาพรวม','- งานทั้งหมด: '+n,'- ความคืบหน้ารวม: '+(n?Math.round(sum/n):0)+'%'];
      ST.forEach(function(s){L.push('- '+s[1]+': '+cnt[s[0]]);});
      L.push('','## ตามหมวดงาน');
      CAT.forEach(function(c){var l=items.filter(function(p){return p.category===c[0];});L.push('- '+c[1]+': '+l.length+' งาน, เสร็จ '+l.filter(function(p){return p.status==='done';}).length+', ความคืบหน้าเฉลี่ย '+(l.length?Math.round(l.reduce(function(s,p){return s+prog(p);},0)/l.length):0)+'%');});
      var al=alerts();L.push('','## งานที่ต้องติดตาม');
      if(!al.length)L.push('- ไม่มี');
      al.forEach(function(a){L.push('- '+a.p.name+' ('+lab(CAT,a.p.category)+') '+(a.k==='late'?'เกินกำหนด '+(-a.diff)+' วัน':a.k==='today'?'ครบกำหนดวันนี้':'อีก '+a.diff+' วัน'));});
      var pj=items.filter(function(p){return p.category==='project';});
      L.push('','## โครงการรับบริหารใหม่');
      if(!pj.length)L.push('- ไม่มี');
      pj.forEach(function(p){L.push('- '+p.name+' ขั้นตอน: '+lab(STG,p.stage)+(p.contractValue?' มูลค่า '+fmtNum(p.contractValue)+' บาท':''));});
      L.push('','## บันทึกการเปลี่ยนแปลงล่าสุด');
      if(!logs.length)L.push('- ไม่มี');
      logs.slice().sort(logSort).slice(0,10).forEach(function(l){L.push('- '+l.date+' ['+lab(LT,l.type)+'] '+l.title);});
      name='summary-'+d+'.md';data=L.join('\n');
    }
    downloads.save({filename:name,data:data}).then(function(){toast('ส่งออกแล้ว');}).catch(function(e){if(e&&e.code==='declined')return;toast('ส่งออกไม่สำเร็จ');});
  }

  var TYPE_BY_EXT={csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json'};
  function uploadFiles(p,files){

          .catch(function(){errs++;});

    },Promise.resolve()).then(function(){

  /* ---------- PIN lock ---------- */
  var lockCfg=null,lockReady=false,lockMode='load',pinBuf='',pinFirst='',unlocked=false,idleT=null;
  try{unlocked=sessionStorage.getItem('pt-unlocked')==='1';}catch(e){}
  function hashPin(pin,salt){
    var str=salt+':'+pin;
    if(window.crypto&&crypto.subtle&&window.TextEncoder){
      return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
    }
    var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))|0;return Promise.resolve('d'+(h>>>0).toString(16));
  }
  function lockOn(){return !!(lockCfg&&lockCfg.hash&&lockCfg.enabled!==false);}
  function renderLock(){
    var el=$('lock');
    var need=!lockReady||(lockMode==='setup')||(lockMode==='change')||(lockOn()&&!unlocked);
    el.hidden=!need;document.body.classList.toggle('locked',need);
    $('lock-btn').hidden=!lockOn();
    if(!need)return;
    var t=$('lk-t'),sub=$('lk-s'),foot=$('lk-foot'),len=lockMode==='unlock'?(lockCfg.len||4):6;
    if(!lockReady){t.textContent='กำลังโหลด…';sub.textContent='';$('lk-pad').innerHTML='';$('lk-dots').innerHTML='';foot.innerHTML='';return;}
    if(lockMode==='setup'||lockMode==='change'){
      t.textContent=pinFirst?'ใส่ PIN อีกครั้งเพื่อยืนยัน':(lockMode==='change'?'ตั้ง PIN ใหม่':'ตั้ง PIN สำหรับโหมดส่วนตัว');
      sub.textContent=pinFirst?'':'ใช้ตัวเลข 4–6 หลัก ทุกครั้งที่เปิดหน้านี้จะต้องใส่ PIN ก่อน';
      foot.innerHTML='<button class="btn" type="button" data-lk="ok"'+(pinBuf.length<4?' disabled':'')+'>'+(pinFirst?'ยืนยัน PIN':'ถัดไป')+'</button>'+(lockMode==='change'?'<button class="btn ghost" type="button" data-lk="cancel">ยกเลิก</button>':'');
    }else{
      t.textContent='ใส่ PIN เพื่อเปิดดูงาน';sub.textContent='หน้านี้อยู่ในโหมดส่วนตัว';
      foot.innerHTML='<button class="lklink" type="button" data-lk="forgot">ลืม PIN?</button>';
    }
    var n=lockMode==='unlock'?len:Math.max(4,pinBuf.length);
    var d='';for(var i=0;i<n;i++)d+='<i'+(i<pinBuf.length?' class="on"':'')+'></i>';
    $('lk-dots').innerHTML=d;
    if(!$('lk-pad').firstChild){var k='';['1','2','3','4','5','6','7','8','9','','0','del'].forEach(function(x){k+=x===''?'<span></span>':'<button type="button" data-k="'+x+'" aria-label="'+(x==='del'?'ลบ':x)+'">'+(x==='del'?'⌫':x)+'</button>';});$('lk-pad').innerHTML=k;}
  }
  function lkErr(m){$('lk-err').textContent=m||'';if(m){var b=$('lock').querySelector('.lkbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}}
  function lkKey(k){
    if(!lockReady)return;
    var max=lockMode==='unlock'?(lockCfg.len||4):6;
    if(k==='del'){pinBuf=pinBuf.slice(0,-1);lkErr('');renderLock();return;}
    if(k==='ok'){lkSubmit();return;}
    if(!/^\d$/.test(k)||pinBuf.length>=max)return;
    pinBuf+=k;lkErr('');renderLock();
    if(lockMode==='unlock'&&pinBuf.length===max)lkSubmit();
  }
  function lkSubmit(){
    if(lockMode==='unlock'){
      var tryPin=pinBuf;
      hashPin(tryPin,lockCfg.salt||'').then(function(h){
        if(h===lockCfg.hash){unlocked=true;try{sessionStorage.setItem('pt-unlocked','1');}catch(e){}pinBuf='';lkErr('');renderLock();bumpIdle();}
        else{pinBuf='';renderLock();lkErr('PIN ไม่ถูกต้อง ลองอีกครั้ง');}
      });
      return;
    }
    if(pinBuf.length<4){lkErr('PIN ต้องมีอย่างน้อย 4 หลัก');return;}
    if(!pinFirst){pinFirst=pinBuf;pinBuf='';renderLock();return;}
    if(pinBuf!==pinFirst){pinFirst='';pinBuf='';renderLock();lkErr('PIN สองครั้งไม่ตรงกัน เริ่มตั้งใหม่');return;}
    var salt=Math.random().toString(36).slice(2,12),len=pinBuf.length,auto=(lockCfg&&lockCfg.auto)||10;
    hashPin(pinBuf,salt).then(function(h){
      var cfg={hash:h,salt:salt,len:len,auto:auto,enabled:true,updatedAt:Date.now()};
      lockCfg=cfg;unlocked=true;try{sessionStorage.setItem('pt-unlocked','1');}catch(e){}
      pinBuf='';pinFirst='';lockMode='unlock';renderLock();toast('ตั้ง PIN แล้ว');render(true);
      if(db)db.doc('settings/lock').set(cfg).catch(handleErr);
    });
  }
  function lockNow(){if(!lockOn())return;unlocked=false;try{sessionStorage.removeItem('pt-unlocked');}catch(e){}pinBuf='';lockMode='unlock';if(modalId||modalMode)closeModal(true);renderLock();}
  function bumpIdle(){clearTimeout(idleT);var m=lockCfg&&+lockCfg.auto;if(lockOn()&&unlocked&&m>0)idleT=setTimeout(lockNow,m*60000);}
  ['pointerdown','keydown','scroll'].forEach(function(ev){document.addEventListener(ev,function(){if(unlocked)bumpIdle();},{passive:true,capture:true});});
  $('lock').addEventListener('click',function(e){
    var k=e.target.closest('[data-k]');if(k){lkKey(k.getAttribute('data-k'));return;}
    var a=e.target.closest('[data-lk]');if(!a)return;var w=a.getAttribute('data-lk');
    if(w==='ok')lkSubmit();

    else if(w==='forgot'){lkErr('');$('lk-s').textContent='พิมพ์บอก Claude ในแชทว่า "รีเซ็ต PIN หน้าติดตามโปรเจ็ค" แล้วตั้ง PIN ใหม่ได้';}
  });
  document.addEventListener('keydown',function(e){
    if($('lock').hidden)return;
    if(/^\d$/.test(e.key)){e.preventDefault();lkKey(e.key);}
    else if(e.key==='Backspace'){e.preventDefault();lkKey('del');}
    else if(e.key==='Enter'){e.preventDefault();lkSubmit();}

    e.stopPropagation();

  $('lock-btn').addEventListener('click',lockNow);

      }
    }catch(e){}
    try{db=await c.use('db');}catch(e){db=null;}
    try{assets=await c.use('assets');}catch(e){assets=null;}
    try{downloads=await c.use('downloads');}catch(e){downloads=null;}
    if(!db){loading=false;unavailable=true;ro=true;lockReady=true;lockMode='unlock';renderLock();render(true);return;}
    var first=0;
    function ready(){first++;if(first>=2){loading=false;}}
    try{
      db.collection('projects').onSnapshot(function(snap){
        items=snap.docs.map(function(d){var p=norm(d.id,d.data());if(pending[d.id])Object.assign(p,pending[d.id]);return p;});
        ready();loading=false;render();
      },function(err){loading=false;if(err&&err.code==='revoked')ro=true;else{unavailable=true;ro=true;}render(true);});
      db.collection('logs').onSnapshot(function(snap){
        logs=snap.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;o.title=o.title||'';o.detail=o.detail||'';o.type=has(LT,o.type)?o.type:'structure';o.date=o.date||'';return o;});
        render();
      },function(){});
      db.doc('settings/lock').onSnapshot(function(snap){
        lockCfg=snap.exists?snap.data():null;lockReady=true;
        if(lockMode!=='change')lockMode='unlock';
        renderLock();bumpIdle();render();
      },function(){lockReady=true;lockMode='unlock';renderLock();});
      db.doc('settings/main').onSnapshot(function(snap){
        if(snap.exists&&snap.data().cycle)cycle=snap.data().cycle;
        if(!calTouched)calKey=cycle;
        render();
      },function(){});
    }catch(e){loading=false;unavailable=true;ro=true;render(true);}
  })();
})();
</script>

</body></html>
